name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual build, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show Swift version
        run: swift --version

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Type-check
        run: make check

      - name: Build the app
        run: make release VERSION="${{ steps.version.outputs.value }}"

      - name: Verify the signature
        run: codesign --verify --verbose "dist/Every Noise.app"

      - uses: actions/upload-artifact@v7
        with:
          name: EveryNoise-${{ steps.version.outputs.value }}
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ASSET="dist/EveryNoise-${VERSION}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — updating the archive and title"
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$VERSION"
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" --title "$VERSION" --generate-notes
          fi
